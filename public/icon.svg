<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="white-shoulder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer Ring Gauge -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="14" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="14" stroke-dasharray="890" stroke-dashoffset="260" stroke-linecap="round" />

  <!-- Center Cylinder Graphic -->
  <g transform="translate(180, 110)">
    <!-- Valve on top -->
    <rect x="62" y="16" width="28" height="24" rx="4" fill="#94a3b8" />
    <path d="M 68 8 L 84 8 L 84 16 L 68 16 Z" fill="#64748b" />
    <circle cx="76" cy="6" r="10" fill="#38bdf8" />
    
    <!-- White Shoulder (Medical O2 standard) -->
    <path d="M 20 100 C 20 45, 132 45, 132 100 Z" fill="url(#white-shoulder)" />
    
    <!-- Black Body -->
    <rect x="20" y="98" width="112" height="180" rx="12" fill="url(#metal)" />
    
    <!-- Text / Label on cylinder -->
    <rect x="36" y="130" width="80" height="40" rx="6" fill="#0284c7" fill-opacity="0.2" />
    <text x="76" y="156" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#38bdf8" text-anchor="middle">O₂</text>
    <text x="76" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#94a3b8" text-anchor="middle">MGPS</text>
  </g>

  <!-- Tank Gauge Indicator in foreground -->
  <g transform="translate(256, 370)">
    <!-- Dial face -->
    <circle cx="0" cy="0" r="62" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
    <!-- Ticks -->
    <line x1="-38" y1="-10" x2="-28" y2="-7" stroke="#e2e8f0" stroke-width="3" />
    <line x1="-28" y1="-28" x2="-20" y2="-20" stroke="#e2e8f0" stroke-width="3" />
    <line x1="0" y1="-42" x2="0" y2="-30" stroke="#22c55e" stroke-width="4" />
    <line x1="28" y1="-28" x2="20" y2="-20" stroke="#e2e8f0" stroke-width="3" />
    <line x1="38" y1="-10" x2="28" y2="-7" stroke="#ef4444" stroke-width="3" />
    <!-- Pointer -->
    <path d="M -4 4 L 0 -36 L 4 4 Z" fill="#38bdf8" transform="rotate(-25)" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
    <!-- mmWC label -->
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" fill="#38bdf8" text-anchor="middle">mmWC</text>
  </g>
</svg>
